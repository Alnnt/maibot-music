[plugin]
enabled = true
config_version = "1.4.6"

[music]
default_platform = "163"
command_prefix = "/"   # 命令前缀，如 / 或 #
auto_parse_url = true
auto_parse_card = true
search_limit = 5
auto_select_first = false   # 多首结果时跳过选歌阶段，直接发送第一首
play_mode = "card"   # 播放模式: voice(语音音频) 或 card(音乐卡片)
voice_source = "local"   # 语音来源: local(本地缓存) 或 remote(远程URL)
cache_storage_dir = "/root/maimai/MaiBot/data/music_cache"   # MaiBot 写入目录
cache_napcat_dir = "/app/music_cache"   # NapCat 进程可见的读取目录
cache_max_size_mb = 1024
cache_expire_hours = 24
cache_cleanup_interval_hours = 24
cache_max_file_size_mb = 50
cache_download_timeout_seconds = 30

[netease]
MUSIC_U = ""        # 登录凭证，用于获取高音质
csrf_token = ""     # __csrf CSRF 令牌，与 MUSIC_U 配对

[qq]
uin = ""                # QQ音乐登录账号，搜索必需
qqmusic_key = ""        # QQ音乐登录凭证，搜索必需，账号权益影响可播放范围

[napcat]
http_url = "http://127.0.0.1:9999"   # 解析音乐卡片原始数据 + 直连发送QQ音乐卡片
http_token = ""                      # NapCat 访问令牌（留空则不鉴权）
